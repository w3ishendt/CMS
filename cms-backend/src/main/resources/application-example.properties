spring.application.name=cms

# Database Configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=your_postgre_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Server Configuration
server.port=${SERVER_PORT:8082}

# Logging Configuration
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate=INFO

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Add these connection stability settings
spring.rabbitmq.listener.simple.missing-queues-fatal=false
spring.rabbitmq.listener.simple.auto-startup=true
spring.rabbitmq.listener.simple.acknowledge-mode=auto

# Connection recovery settings
spring.rabbitmq.requested-heartbeat=60
spring.rabbitmq.connection-timeout=30000

# Add to application.properties
csv.output.directory=./csv-exports

# Google Sheet read proxy (Apps Script web app)
google.sheet.read.url=https://script.google.com/macros/s/your_google_sheet_url/exec
google.sheet.read.api-key=your_google_sheet_api

# Google Sheet -> PostgreSQL sync
google.sheet.sync.enabled=true
google.sheet.sync.initial-delay-ms=30000
google.sheet.sync.interval-ms=300000

# Stale detection tuning
# Monitor scripts and Google Sheet sync run on a 5-minute cadence, so keep a larger buffer
# to avoid false mass-stale events during one delayed cycle or a short backend interruption.
device.stale.threshold-seconds=900
device.stale.check-interval-ms=60000
